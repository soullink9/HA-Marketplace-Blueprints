# HA-Marketplace-Blueprints v0.5.0 - https://github.com/soullink9/HA-Marketplace-Blueprints
blueprint:
  name: Adaptive Lights – Automatic Room Lighting · v0.5.0
  description: >
    **Version 0.5.0** · [What's new](https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/CHANGELOG.md)


    Turns a room's lights on and off with presence sensors or a schedule,
    and can match brightness and color to the time of day. Fill in the first
    three sections; everything below them is optional.
  domain: automation
  author: soullink9
  source_url: https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/blueprints/adaptive_light_controller/adaptive_light_controller.yaml
  homeassistant:
    min_version: "2026.11.0"

  input:
    section_lights:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        light_targets:
          name: Lights
          description: >-
            The lights to control. To use a plug or switch, first turn it
            into a light: Settings → Helpers → Create helper → Switch as X →
            Light.
          selector:
            target:
              entity:
                domain: light

        control_mode:
          name: Turn lights on and off with
          description: >-
            With sensors, lights come on when someone is there and stay off
            when nobody is.
          default: presence
          selector:
            select:
              options:
              - label: Motion or presence sensors
                value: presence
              - label: A schedule only
                value: schedule

    section_presence:
      name: Presence
      icon: mdi:motion-sensor
      visible:
        field: control_mode
        value: presence
      input:
        presence_sensors:
          name: Presence sensors
          description: >-
            Motion, occupancy or presence sensors in this room.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: binary_sensor
                device_class:
                - occupancy
                - presence

        presence_off_delay:
          name: Turn off when nobody is there for
          description: >-
            A sensor that sees someone again restarts the wait.
          default: 1
          selector:
            number:
              min: 1
              max: 60
              mode: slider
              unit_of_measurement: minutes

        ambient_off_ignores_presence:
          name: Turn off when the schedule ends, even if someone is there
          description: >-
            For example at the end time, or when the room gets bright. When
            off, lights stay on until the room is empty.
          default: true
          selector:
            boolean: {}

    section_schedule:
      name: When lights should be on
      icon: mdi:clock-outline
      input:
        preset_choice:
          name: Lights should be on
          description: >-
            Only the settings for your choice are shown below.
          default: time_or_sun_and_lux
          selector:
            select:
              options:
              - label: Any time someone is there (presence only)
                value: always
              - label: Between set times
                value: time_only
              - label: When the sun is down
                value: sun_only
              - label: When the room is dark (light sensor)
                value: lux_only
              - label: When the sun is down and the room is dark
                value: sun_and_lux
              - label: Between set times, or when the sun is down and the room is dark
                value: time_or_sun_and_lux
              - label: Between set times, when the sun is down, or when the room is dark
                value: or

        on_time:
          name: From
          visible:
            field: preset_choice
            operator: in
            value:
            - time_only
            - time_or_sun_and_lux
            - or
          default: "18:00:00"
          selector:
            time: {}

        off_time:
          name: Until
          description: >-
            Can be after midnight, for example 18:00 until 06:00.
          visible:
            field: preset_choice
            operator: in
            value:
            - time_only
            - time_or_sun_and_lux
            - or
          default: "23:00:00"
          selector:
            time: {}

        solar_elevation_threshold:
          name: Sun counts as down below
          description: >-
            Sun height in degrees. -4 is about dusk; lower waits for a
            darker sky.
          visible:
            field: preset_choice
            operator: not_in
            value:
            - always
            - time_only
          default: -4
          selector:
            number:
              min: -20
              max: 10
              step: 0.5
              unit_of_measurement: °

        lux_sensor:
          name: Light sensor
          description: >-
            If you pick more than one, the first is used.
          visible:
            field: preset_choice
            operator: in
            value:
            - lux_only
            - sun_and_lux
            - time_or_sun_and_lux
            - or
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: sensor
                device_class: illuminance

        lux_on_threshold:
          name: Dark below
          visible:
            field: preset_choice
            operator: in
            value:
            - lux_only
            - sun_and_lux
            - time_or_sun_and_lux
            - or
          default: 50
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx

        lux_off_threshold:
          name: Bright above
          description: >-
            Keep this above "Dark below" so the lights don't flicker.
          visible:
            field: preset_choice
            operator: in
            value:
            - lux_only
            - sun_and_lux
            - time_or_sun_and_lux
            - or
          default: 80
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx

        min_lux_keep_on:
          name: Never turn off while darker than
          description: >-
            0 turns this off.
          visible:
            field: preset_choice
            operator: in
            value:
            - lux_only
            - sun_and_lux
            - time_or_sun_and_lux
            - or
          default: 0
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx

        lux_stale_minutes:
          name: Treat the light sensor as offline after
          description: >-
            No reading for this long means it's offline and its last value
            is ignored. 0 = never.
          visible:
            field: preset_choice
            operator: in
            value:
            - lux_only
            - sun_and_lux
            - time_or_sun_and_lux
            - or
          default: 30
          selector:
            number:
              min: 0
              max: 720
              mode: box
              unit_of_measurement: minutes

        lux_fallback_to_sun:
          name: Use the sun while the light sensor is offline
          visible:
            field: preset_choice
            operator: in
            value:
            - lux_only
            - sun_and_lux
            - time_or_sun_and_lux
            - or
          default: true
          selector:
            boolean: {}

        active_days:
          name: Days
          description: >-
            The automation does nothing on unchecked days.
          default:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          selector:
            select:
              multiple: true
              options:
              - Sunday
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
              - Saturday

    section_circadian:
      name: Brightness and color
      icon: mdi:brightness-6
      collapsed: true
      input:
        use_circadian:
          name: Follow the time of day
          description: >-
            Bright and cool at midday, dim and warm after sunset. Lights
            that are already on fade slowly to match.
          default: true
          selector:
            boolean: {}

        day_brightness:
          name: Daytime brightness
          visible:
            field: use_circadian
            value: true
          default: 100
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: '%'

        quiet_hours_brightness:
          name: Evening brightness
          description: >-
            Also used all through quiet hours.
          visible:
            field: use_circadian
            value: true
          default: 25
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: '%'

        day_kelvin:
          name: Daytime color
          description: >-
            Higher is cooler and bluer.
          visible:
            field: use_circadian
            value: true
          default: 4500
          selector:
            number:
              min: 2000
              max: 6500
              mode: slider
              unit_of_measurement: K

        quiet_hours_kelvin:
          name: Evening color
          description: >-
            Lower is warmer.
          visible:
            field: use_circadian
            value: true
          default: 2200
          selector:
            number:
              min: 2000
              max: 6500
              mode: slider
              unit_of_measurement: K

        quiet_hours_start:
          name: Quiet hours start
          description: >-
            From here until quiet hours end, lights stay at the evening
            brightness, even after an early summer sunrise.
          visible:
            field: use_circadian
            value: true
          default: "22:00:00"
          selector:
            time: {}

        quiet_hours_end:
          name: Quiet hours end
          visible:
            field: use_circadian
            value: true
          default: "06:00:00"
          selector:
            time: {}

        circadian_transition_seconds:
          name: Fade time
          description: >-
            How long lights that are on take to change. 0 = instantly.
          visible:
            field: use_circadian
            value: true
          default: 30
          selector:
            number:
              min: 0
              max: 300
              mode: slider
              unit_of_measurement: seconds

    section_manual:
      name: Manual changes
      icon: mdi:hand-back-right
      collapsed: true
      input:
        enable_manual_override_protection:
          name: Pause after someone changes a light by hand
          description: >-
            So a switch, app or voice change isn't undone right away.
          default: false
          selector:
            boolean: {}

        override_direction:
          name: Pause after
          visible:
            field: enable_manual_override_protection
            value: true
          default: both
          selector:
            select:
              options:
              - label: Turning it on or off by hand
                value: both
              - label: Turning it on by hand (no automatic off)
                value: block_off_after_manual_on
              - label: Turning it off by hand (no automatic on)
                value: block_on_after_manual_off

        override_duration_minutes:
          name: Pause for
          visible:
            field: enable_manual_override_protection
            value: true
          default: 15
          selector:
            number:
              min: 1
              max: 180
              mode: slider
              unit_of_measurement: minutes

    section_exceptions:
      name: Exceptions
      icon: mdi:cancel
      collapsed: true
      input:
        enable_media_guard:
          name: Don't change the lights while media is playing
          default: false
          selector:
            boolean: {}

        media_entities:
          name: Media players
          visible:
            field: enable_media_guard
            value: true
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: media_player

        block_auto_on_entities:
          name: Don't turn on while any of these are on
          description: >-
            For example an "in bed" sensor.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
                - input_boolean

        block_auto_off_entities:
          name: Don't turn off while any of these are on
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
                - input_boolean

        enable_off_block_window:
          name: Never turn off during set hours
          default: false
          selector:
            boolean: {}

        off_block_start:
          name: From
          visible:
            field: enable_off_block_window
            value: true
          default: "00:00:00"
          selector:
            time: {}

        off_block_end:
          name: Until
          description: >-
            At this time the lights turn off if nothing else keeps them on.
          visible:
            field: enable_off_block_window
            value: true
          default: "00:00:00"
          selector:
            time: {}

    section_advanced:
      name: Advanced
      icon: mdi:cog
      collapsed: true
      input:
        self_healing_enabled:
          name: Re-check every 5 minutes
          description: >-
            Catches anything missed, for example during a restart. Leave
            this on.
          default: true
          selector:
            boolean: {}

        debug_logging:
          name: Debug logging
          description: >-
            Writes one line per run to the Home Assistant log.
          default: false
          selector:
            boolean: {}

###############################################################################
# TRIGGERS
###############################################################################
triggers:
  - trigger: state
    entity_id: !input presence_sensors
    to: "on"
    id: presence_on

  - trigger: state
    entity_id: !input presence_sensors
    to: "off"
    for:
      minutes: !input presence_off_delay
    id: presence_off_candidate

  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input solar_elevation_threshold
    id: ambient_recompute

  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input solar_elevation_threshold
    id: ambient_recompute

  - trigger: numeric_state
    entity_id: !input lux_sensor
    below: !input lux_on_threshold
    id: ambient_recompute

  - trigger: numeric_state
    entity_id: !input lux_sensor
    above: !input lux_off_threshold
    id: ambient_recompute

  - trigger: time
    at: !input on_time
    id: ambient_recompute

  - trigger: time
    at: !input off_time
    id: ambient_recompute

  - trigger: time
    at: !input quiet_hours_start
    enabled: !input use_circadian
    id: ambient_recompute

  - trigger: time
    at: !input quiet_hours_end
    enabled: !input use_circadian
    id: ambient_recompute

  - trigger: time_pattern
    minutes: "/5"
    enabled: !input self_healing_enabled
    id: self_healing

  - trigger: time
    at: !input off_block_end
    enabled: !input enable_off_block_window
    id: off_block_window_end

###############################################################################
# CONDITIONS (apply to every trigger)
###############################################################################
conditions:
  - condition: template
    value_template: >
      {% set today = now().strftime('%A').lower() %}
      {% set days = active_days_var | map('lower') | list %}
      {{ today in days }}

###############################################################################
# VARIABLES
###############################################################################
variables:

  light_targets: !input light_targets
  active_days_var: !input active_days
  self_healing_enabled_var: !input self_healing_enabled
  debug_logging: !input debug_logging

  presence_sensors_var: !input presence_sensors
  presence_off_delay_var: !input presence_off_delay

  control_mode: !input control_mode
  preset_choice: !input preset_choice
  # The preset alone decides which of time, sun and light sensor count.
  time_window_enabled: "{{ preset_choice in ['time_only', 'time_or_sun_and_lux', 'or'] }}"
  on_time: !input on_time
  off_time: !input off_time
  on_str: "{{ on_time ~ ':00' if (on_time | length == 5) else on_time }}"
  off_str: "{{ off_time ~ ':00' if (off_time | length == 5) else off_time }}"

  solar_enabled: "{{ preset_choice in ['sun_only', 'sun_and_lux', 'time_or_sun_and_lux', 'or'] }}"
  solar_threshold: !input solar_elevation_threshold

  lux_enabled: "{{ preset_choice in ['lux_only', 'sun_and_lux', 'time_or_sun_and_lux', 'or'] }}"
  lux_sensor_list: !input lux_sensor
  lux_sensor: "{{ (lux_sensor_list | first) if lux_sensor_list else none }}"
  lux_on_threshold: !input lux_on_threshold
  lux_off_threshold: !input lux_off_threshold
  lux_stale_minutes: !input lux_stale_minutes
  lux_fallback_to_sun: !input lux_fallback_to_sun


  use_circadian: !input use_circadian
  quiet_hours_start: !input quiet_hours_start
  quiet_hours_end: !input quiet_hours_end
  day_brightness: !input day_brightness
  quiet_hours_brightness: !input quiet_hours_brightness
  day_kelvin: !input day_kelvin
  quiet_hours_kelvin: !input quiet_hours_kelvin
  circadian_transition_seconds: !input circadian_transition_seconds
  ambient_off_ignores_presence_var: !input ambient_off_ignores_presence

  enable_media_guard_var: !input enable_media_guard
  media_entities_var: !input media_entities
  min_lux_keep_on_var: !input min_lux_keep_on
  enable_off_block_window_var: !input enable_off_block_window
  off_block_start_var: !input off_block_start
  off_block_end_var: !input off_block_end

  enable_manual_override_var: !input enable_manual_override_protection
  override_direction_var: !input override_direction
  override_duration_minutes_var: !input override_duration_minutes
  block_auto_on_entities_var: !input block_auto_on_entities
  block_auto_off_entities_var: !input block_auto_off_entities

  now_str: "{{ now().strftime('%H:%M:%S') }}"

  # ---------------------------------------------------------------------------
  # LIGHT ID EXTRACTION — expands entity_id/device_id/area_id from the
  # target selector into a flat list of light.* entities.
  # ---------------------------------------------------------------------------
  light_ids: >
    {% set t = light_targets %}
    {% set raw_entities = (t.entity_id if t is mapping and t.entity_id is defined else []) %}
    {% set raw_entities = [raw_entities] if raw_entities is string else raw_entities %}
    {% set raw_devices = (t.device_id if t is mapping and t.device_id is defined else []) %}
    {% set raw_devices = [raw_devices] if raw_devices is string else raw_devices %}
    {% set raw_areas = (t.area_id if t is mapping and t.area_id is defined else []) %}
    {% set raw_areas = [raw_areas] if raw_areas is string else raw_areas %}
    {% set from_devices = raw_devices | map('device_entities') | sum(start=[]) %}
    {% set from_areas = raw_areas | map('area_entities') | sum(start=[]) %}
    {% set all_ids = (raw_entities + from_devices + from_areas) | unique | list %}
    {% set ns = namespace(lights=[]) %}
    {% for eid in all_ids %}
      {% if eid.split('.')[0] == 'light' %}
        {% set ns.lights = ns.lights + [eid] %}
      {% endif %}
    {% endfor %}
    {{ ns.lights }}

  any_on: "{{ light_ids | select('is_state', 'on') | list | count > 0 }}"
  all_off: "{{ light_ids | select('is_state', 'on') | list | count == 0 }}"

  # ---------------------------------------------------------------------------
  # AMBIENT PRESET ENGINE
  # ---------------------------------------------------------------------------
  sun_elev: >
    {% set e = state_attr('sun.sun', 'elevation') %}
    {{ e if e is not none else -90 }}

  # The lux sensor is trusted only if it has a number AND reported recently.
  # last_reported moves on every update even when the value is unchanged,
  # so a sensor sitting at 0 lx all night is still "fresh". A station that
  # stopped sending keeps its last value in Home Assistant forever, which
  # is what made lights come on at midday and stay off at night.
  lux_fresh: >
    {% set st = states[lux_sensor] if lux_sensor else none %}
    {{ st is not none and st.state | is_number
       and (lux_stale_minutes | int == 0
            or (now() - st.last_reported).total_seconds() < lux_stale_minutes | int * 60) }}
  lux_ok: "{{ lux_enabled and lux_fresh }}"
  lux_use_sun: "{{ lux_enabled and not lux_ok and lux_fallback_to_sun }}"

  lux_value: "{{ states(lux_sensor) | float(99999) if lux_ok else 99999 }}"

  time_window_active: >
    {% set now_t = strptime(now_str, '%H:%M:%S').time() %}
    {% set on_t = strptime(on_str, '%H:%M:%S').time() %}
    {% set off_t = strptime(off_str, '%H:%M:%S').time() %}
    {% if not time_window_enabled %}
      false
    {% elif on_t < off_t %}
      {{ now_t >= on_t and now_t < off_t }}
    {% else %}
      {{ now_t >= on_t or now_t < off_t }}
    {% endif %}

  time_wants_on: "{{ time_window_active | bool }}"
  time_wants_off: "{{ time_window_enabled and not (time_window_active | bool) }}"
  sun_wants_on: "{{ sun_elev <= solar_threshold if solar_enabled else false }}"
  sun_wants_off: "{{ sun_elev > solar_threshold if solar_enabled else false }}"
  # Dead sensor + fallback: the sun casts the lux vote instead.
  lux_wants_on: >
    {% if not lux_enabled %} {{ false }}
    {% elif lux_use_sun %} {{ sun_elev <= solar_threshold }}
    {% else %} {{ lux_value <= lux_on_threshold }}
    {% endif %}
  lux_wants_off: >
    {% if not lux_enabled %} {{ false }}
    {% elif lux_use_sun %} {{ sun_elev > solar_threshold }}
    {% else %} {{ lux_value >= lux_off_threshold }}
    {% endif %}

  preset_on: >
    {% set p = preset_choice %}
    {{ (
      (p == 'always') or
      (p == 'time_only' and time_wants_on) or
      (p == 'lux_only' and lux_wants_on) or
      (p == 'sun_only' and sun_wants_on) or
      (p == 'or' and (time_wants_on or lux_wants_on or sun_wants_on)) or
      (p == 'sun_and_lux' and (sun_wants_on and lux_wants_on)) or
      (p == 'time_or_sun_and_lux' and (time_wants_on or (sun_wants_on and lux_wants_on)))
    ) | bool }}

  preset_off: >
    {% set p = preset_choice %}
    {{ (
      (p == 'time_only' and time_wants_off) or
      (p == 'lux_only' and lux_wants_off) or
      (p == 'sun_only' and sun_wants_off) or
      (p == 'or' and (time_wants_off or lux_wants_off or sun_wants_off)) or
      (p == 'sun_and_lux' and (sun_wants_off and lux_wants_off)) or
      (p == 'time_or_sun_and_lux' and (time_wants_off or (sun_wants_off and lux_wants_off)))
    ) | bool }}

  # ---------------------------------------------------------------------------
  # CIRCADIAN BRIGHTNESS / COLOR
  # ---------------------------------------------------------------------------
  day_fraction: "{{ [[sun_elev / 20, 1] | min, 0] | max }}"
  in_quiet_hours: >
    {{ (now_str >= quiet_hours_start or now_str < quiet_hours_end)
       if quiet_hours_start > quiet_hours_end else
       (now_str >= quiet_hours_start and now_str < quiet_hours_end) }}
  target_brightness_pct: >
    {% set raw = quiet_hours_brightness + (day_brightness - quiet_hours_brightness) * day_fraction %}
    {{ [raw, quiet_hours_brightness] | min if in_quiet_hours else raw }}
  target_kelvin: "{{ (quiet_hours_kelvin + (day_kelvin - quiet_hours_kelvin) * day_fraction) | round(0) }}"

  # Lights that are ON but not yet at the current circadian target (brightness
  # off by more than 3 %, or color temperature off by more than 100 K). Lights
  # already close to target are left alone so we don't spam the bulbs.
  lights_needing_circadian_update: >
    {% set ns = namespace(out=[]) %}
    {% set tb = target_brightness_pct | float(0) %}
    {% set tk = target_kelvin | float(0) %}
    {% for eid in light_ids %}
      {% if is_state(eid, 'on') %}
        {% set b = state_attr(eid, 'brightness') %}
        {% set k = state_attr(eid, 'color_temp_kelvin') %}
        {% set b_off = b is number and ((b / 255 * 100) - tb) | abs > 3 %}
        {% set k_off = k is number and (k - tk) | abs > 100 %}
        {% if b_off or k_off %}
          {% set ns.out = ns.out + [eid] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

  # ---------------------------------------------------------------------------
  # PRESENCE STATE
  # ---------------------------------------------------------------------------
  presence_configured: "{{ presence_sensors_var | length > 0 }}"
  presence_active: >
    {{ presence_configured and
       (expand(presence_sensors_var) | selectattr('state','eq','on') | list | length > 0) }}
  presence_off_and_delay_elapsed: >
    {% if not presence_configured %}
      true
    {% else %}
      {% set ns = namespace(all_clear=true) %}
      {% for eid in presence_sensors_var %}
        {% set st = states[eid] %}
        {% if not st or st.state != 'off' or (now() - st.last_changed).total_seconds() < ((presence_off_delay_var * 60) - 1) %}
          {% set ns.all_clear = false %}
        {% endif %}
      {% endfor %}
      {{ ns.all_clear }}
    {% endif %}

  media_playing: >
    {{ enable_media_guard_var and
       (expand(media_entities_var) | selectattr('state','eq','playing') | list | length > 0) }}

  off_block_active: >
    {% set start = off_block_start_var %}
    {% set end = off_block_end_var %}
    {% if start <= end %}
      {{ enable_off_block_window_var and (start <= now_str <= end) }}
    {% else %}
      {{ enable_off_block_window_var and (now_str >= start or now_str <= end) }}
    {% endif %}

  # Only a fresh reading can hold the lights on; a dead sensor stuck on its
  # overnight value would otherwise block every OFF all day.
  lux_keep_on_active: >
    {{ lux_fresh and states(lux_sensor) | float(999999) < min_lux_keep_on_var }}

  # ---------------------------------------------------------------------------
  # MANUAL OVERRIDE PROTECTION — no helpers. Reads each light's own live
  # context/last_changed. A change looks "manual" if a person did it
  # (context.user_id set) or has no parent context at all (typical of a
  # physical switch).
  #
  # Catch: a run started by a clock trigger (Self-Healing every 5 minutes,
  # the Time Window, Quiet Hours or OFF Block Window times) has no parent
  # context either, so this automation's OWN clock-driven ON/OFF looked
  # manual and blocked the next opposite action for the whole Override
  # Duration. Those runs always start at second 0 of a 5-minute mark or of
  # one of the configured times, so a parent-less change in the first few
  # seconds of those minutes is treated as ours. A real switch press only
  # collides with that window about 3% of the time.
  # ---------------------------------------------------------------------------
  clock_trigger_minutes: >
    {% set ns = namespace(m=[]) %}
    {% set times = ([on_time, off_time] if time_window_enabled else [])
         + ([quiet_hours_start, quiet_hours_end] if use_circadian else [])
         + ([off_block_end_var] if enable_off_block_window_var else []) %}
    {% for t in times %}
      {% set ns.m = ns.m + [(t | string)[:5]] %}
    {% endfor %}
    {{ ns.m }}
  any_manual_on_var: >
    {% set ns = namespace(found=false) %}
    {% for eid in light_ids %}
      {% set st = states[eid] %}
      {% if st and st.state == 'on' %}
        {% set lc = as_local(st.last_changed) %}
        {% set from_our_clock = lc.second < 10
             and ((self_healing_enabled_var and lc.minute % 5 == 0)
                  or lc.strftime('%H:%M') in clock_trigger_minutes) %}
        {% set is_manual = (st.context.user_id is not none)
             or (st.context.parent_id is none and not from_our_clock) %}
        {% set age = (now() - st.last_changed).total_seconds() %}
        {% if is_manual and age < (override_duration_minutes_var * 60) %}
          {% set ns.found = true %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}

  any_manual_off_var: >
    {% set ns = namespace(found=false) %}
    {% for eid in light_ids %}
      {% set st = states[eid] %}
      {% if st and st.state == 'off' %}
        {% set lc = as_local(st.last_changed) %}
        {% set from_our_clock = lc.second < 10
             and ((self_healing_enabled_var and lc.minute % 5 == 0)
                  or lc.strftime('%H:%M') in clock_trigger_minutes) %}
        {% set is_manual = (st.context.user_id is not none)
             or (st.context.parent_id is none and not from_our_clock) %}
        {% set age = (now() - st.last_changed).total_seconds() %}
        {% if is_manual and age < (override_duration_minutes_var * 60) %}
          {% set ns.found = true %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}

  history_blocks_on_var: >-
    {{ enable_manual_override_var
       and any_manual_off_var
       and override_direction_var in ['both','block_on_after_manual_off'] }}

  history_blocks_off_var: >-
    {{ enable_manual_override_var
       and any_manual_on_var
       and override_direction_var in ['both','block_off_after_manual_on'] }}

  # ---------------------------------------------------------------------------
  # BLOCK ENTITIES — independent of the toggle above; active whenever the
  # respective list is non-empty and any listed entity is currently "on".
  # ---------------------------------------------------------------------------
  block_entities_block_on_var: >-
    {{ block_auto_on_entities_var | length > 0
       and (expand(block_auto_on_entities_var) | selectattr('state','eq','on') | list | length > 0) }}

  block_entities_block_off_var: >-
    {{ block_auto_off_entities_var | length > 0
       and (expand(block_auto_off_entities_var) | selectattr('state','eq','on') | list | length > 0) }}

  manual_override_blocks_on_var: "{{ history_blocks_on_var or block_entities_block_on_var }}"
  manual_override_blocks_off_var: "{{ history_blocks_off_var or block_entities_block_off_var }}"

###############################################################################
# ACTIONS
###############################################################################
actions:

  - if:
      - condition: template
        value_template: "{{ debug_logging }}"
    then:
      - action: system_log.write
        data:
          level: info
          message: >
            [Adaptive Light Controller]
            trigger_id={{ trigger.id if trigger.id is defined else 'none' }}
            light_ids={{ light_ids }} any_on={{ any_on }} all_off={{ all_off }}
            preset_on={{ preset_on }} preset_off={{ preset_off }}
            presence_configured={{ presence_configured }} presence_active={{ presence_active }}
            presence_off_and_delay_elapsed={{ presence_off_and_delay_elapsed }} ambient_off_ignores_presence={{ ambient_off_ignores_presence_var }}
            media_playing={{ media_playing }} off_block_active={{ off_block_active }}
            lux_ok={{ lux_ok }} lux_use_sun={{ lux_use_sun }} lux_value={{ lux_value }}
            lux_keep_on_active={{ lux_keep_on_active }}
            history_blocks_on={{ history_blocks_on_var }} history_blocks_off={{ history_blocks_off_var }}
            block_entities_block_on={{ block_entities_block_on_var }} block_entities_block_off={{ block_entities_block_off_var }}
            target_brightness_pct={{ target_brightness_pct }} target_kelvin={{ target_kelvin }}
            circadian_update_needed={{ lights_needing_circadian_update }}

  - choose:

      # ---- Presence ON ----
      - conditions:
          - condition: trigger
            id: presence_on
        sequence:
          - if:
              - condition: template
                value_template: "{{ media_playing or manual_override_blocks_on_var or not (preset_on | bool) }}"
            then:
              - stop: Blocked by media guard, manual override / block entity, or ambient conditions.
          - if:
              - condition: template
                value_template: "{{ any_on | bool }}"
            then:
              - stop: Already on - circadian updates for lights that are on are handled by the recompute/self-healing path.
          - if:
              - condition: template
                value_template: "{{ use_circadian }}"
            then:
              - action: light.turn_on
                target: !input light_targets
                data:
                  brightness_pct: "{{ target_brightness_pct | round(0) | int }}"
                  color_temp_kelvin: "{{ target_kelvin | int }}"
            else:
              - action: light.turn_on
                target: !input light_targets

      # ---- Presence OFF (fires only after every sensor stayed clear for the full delay) ----
      # The delay lives in the trigger itself (state trigger with "for"), so Home
      # Assistant cancels the timer if a sensor reports presence again before it
      # ends. No long-running delayed runs, and no early OFF from a brief blip.
      - conditions:
          - condition: trigger
            id: presence_off_candidate
        sequence:
          - if:
              - condition: template
                value_template: "{{ not (presence_off_and_delay_elapsed | bool) }}"
            then:
              - stop: Another presence sensor is still active or has not been clear long enough.
          - if:
              - condition: template
                value_template: "{{ media_playing or off_block_active or manual_override_blocks_off_var }}"
            then:
              - stop: Blocked by media guard, off-block window, manual override, or block entity.
          - if:
              - condition: template
                value_template: "{{ lux_keep_on_active }}"
            then:
              - stop: Too dark to turn off (min-lux-keep-on guard).
          - action: light.turn_off
            target: !input light_targets

      # ---- OFF block window just ended: re-evaluate immediately ----
      - conditions:
          - condition: trigger
            id: off_block_window_end
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ not enable_off_block_window_var or media_playing or manual_override_blocks_off_var
                     or lux_keep_on_active
                     or (expand(presence_sensors_var) | selectattr('state','eq','on') | list | length > 0) }}
            then:
              - stop: Nothing to do at end of off-block window.
          - action: light.turn_off
            target: !input light_targets

      # ---- Ambient recompute: schedule-only control, or self-healing safety net ----
      # NOTE: a list of conditions here is ANDed by Home Assistant, not ORed.
      # A single trigger can't have two different IDs, so listing both
      # separately made this branch impossible to reach. Using one
      # condition with a list of IDs matches either trigger correctly.
      - conditions:
          - condition: trigger
            id:
              - ambient_recompute
              - self_healing
        sequence:
          - variables:
              should_force_on: >-
                {{ (preset_on | bool) and (all_off | bool)
                   and (not presence_configured or presence_active)
                   and not manual_override_blocks_on_var
                   and not media_playing }}
              should_force_off: >-
                {{ (preset_off | bool) and (any_on | bool)
                   and (not presence_configured or ambient_off_ignores_presence_var or presence_off_and_delay_elapsed)
                   and not manual_override_blocks_off_var
                   and not media_playing and not off_block_active and not lux_keep_on_active }}
              should_refresh_circadian: >-
                {{ (use_circadian | bool)
                   and (lights_needing_circadian_update | length > 0)
                   and not media_playing
                   and not (history_blocks_off_var | bool) }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ should_force_on }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ use_circadian }}"
                    then:
                      - action: light.turn_on
                        target: !input light_targets
                        data:
                          brightness_pct: "{{ target_brightness_pct | round(0) | int }}"
                          color_temp_kelvin: "{{ target_kelvin | int }}"
                    else:
                      - action: light.turn_on
                        target: !input light_targets
              - conditions:
                  - condition: template
                    value_template: "{{ should_force_off }}"
                sequence:
                  - action: light.turn_off
                    target: !input light_targets
              # Lights are staying on: fade only the lights that are on toward the
              # current circadian target (quiet hours / sun position).
              - conditions:
                  - condition: template
                    value_template: "{{ should_refresh_circadian }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights_needing_circadian_update }}"
                    data:
                      brightness_pct: "{{ target_brightness_pct | round(0) | int }}"
                      color_temp_kelvin: "{{ target_kelvin | int }}"
                      transition: "{{ circadian_transition_seconds | int }}"

    default: []

mode: parallel
max: 15
