# HA-Marketplace-Blueprints v0.6.0 - https://github.com/soullink9/HA-Marketplace-Blueprints
blueprint:
  name: Curtains – Morning Open and Evening Close · v0.6.0
  description: >
    **Version 0.6.0** · [What's new](https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/CHANGELOG.md)


    Opens curtains in the morning and closes them in the evening, using a
    light sensor, the sun, or both.
  domain: automation
  author: soullink9
  source_url: https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/blueprints/open_close_curtains/open_close_curtains.yaml
  homeassistant:
    min_version: "2026.11.0"

  input:
    section_curtains:
      name: Curtains
      icon: mdi:curtains
      input:
        curtains:
          name: Curtains
          selector:
            entity:
              multiple: true
              filter:
              - domain: cover

        enable_morning_open:
          name: Open in the morning
          default: true
          selector:
            boolean: {}

        enable_evening_close:
          name: Close in the evening
          default: true
          selector:
            boolean: {}

    section_morning:
      name: Morning
      icon: mdi:weather-sunset-up
      visible:
        field: enable_morning_open
        value: true
      input:
        morning_source:
          name: Open when
          default: both
          selector:
            select:
              options:
              - label: It gets bright (light sensor or sun, whichever is first)
                value: both
              - label: The sun rises
                value: sun
              - label: The light sensor reads bright
                value: sensor

        morning_illuminance_sensor:
          name: Light sensor
          visible:
            field: morning_source
            operator: not_eq
            value: sun
          default: []
          selector:
            entity:
              multiple: false
              filter:
              - domain: sensor
                device_class: illuminance

        morning_illuminance_threshold:
          name: Bright above
          visible:
            field: morning_source
            operator: not_eq
            value: sun
          default: 50
          selector:
            number:
              min: 0
              max: 500
              unit_of_measurement: lx
              mode: slider

        morning_above_duration:
          name: For at least
          visible:
            field: morning_source
            operator: not_eq
            value: sun
          default:
            minutes: 1
          selector:
            duration: {}

        morning_sun_elevation:
          name: Sun is up above
          description: >-
            Sun height in degrees. Also used while the light sensor is
            offline.
          default: 0
          selector:
            number:
              min: -20
              max: 20
              unit_of_measurement: °
              mode: slider

        morning_not_before:
          name: Not before
          description: >-
            Handy in summer, when the sun rises very early.
          default: "06:30:00"
          selector:
            time: {}

        morning_not_after:
          name: Not after
          description: >-
            Curtains you close later in the day stay closed.
          default: "12:00:00"
          selector:
            time: {}

        enable_morning_failsafe:
          name: Always open by a set time
          default: false
          selector:
            boolean: {}

        morning_failsafe_time:
          name: Open by
          visible:
            field: enable_morning_failsafe
            value: true
          default: "09:00:00"
          selector:
            time: {}

    section_evening:
      name: Evening
      icon: mdi:weather-sunset-down
      visible:
        field: enable_evening_close
        value: true
      input:
        evening_source:
          name: Close when
          default: both
          selector:
            select:
              options:
              - label: It gets dark (light sensor or sun, whichever is first)
                value: both
              - label: The sun sets
                value: sun
              - label: The light sensor reads dark
                value: sensor

        evening_illuminance_sensor:
          name: Light sensor
          visible:
            field: evening_source
            operator: not_eq
            value: sun
          default: []
          selector:
            entity:
              multiple: false
              filter:
              - domain: sensor
                device_class: illuminance

        evening_illuminance_threshold:
          name: Dark below
          visible:
            field: evening_source
            operator: not_eq
            value: sun
          default: 5
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: lx
              mode: slider

        evening_below_duration:
          name: For at least
          visible:
            field: evening_source
            operator: not_eq
            value: sun
          default:
            minutes: 1
          selector:
            duration: {}

        evening_sun_elevation:
          name: Sun is down below
          description: >-
            Sun height in degrees. Also used while the light sensor is
            offline.
          default: -2
          selector:
            number:
              min: -20
              max: 20
              unit_of_measurement: °
              mode: slider

        enable_evening_failsafe:
          name: Always close by a set time
          default: false
          selector:
            boolean: {}

        evening_failsafe_time:
          name: Close by
          visible:
            field: enable_evening_failsafe
            value: true
          default: "22:00:00"
          selector:
            time: {}

    section_protections:
      name: Reliability
      icon: mdi:shield-check-outline
      collapsed: true
      input:
        enable_startup_recheck:
          name: Catch up after Home Assistant restarts
          default: true
          selector:
            boolean: {}

        enable_periodic_recheck:
          name: Re-check every 15 minutes
          description: >-
            Fixes anything missed. Does nothing if the curtains are already
            right.
          default: true
          selector:
            boolean: {}

        sensor_stale_minutes:
          name: Treat a light sensor as offline after
          description: >-
            No reading for this long means it's offline, and the sun is used
            instead. 0 = never.
          default: 30
          selector:
            number:
              min: 0
              max: 720
              unit_of_measurement: minutes
              mode: box

        sun_sanity_check:
          name: Ignore light readings that don't match the sun
          description: >-
            Never closes for "dark" in full daylight or opens for "bright"
            at night, for example from a covered or stuck sensor.
          default: true
          selector:
            boolean: {}

mode: single
# A periodic check landing while a failsafe is running is simply dropped.
max_exceeded: silent

variables:
  enable_evening_close: !input enable_evening_close
  enable_morning_open: !input enable_morning_open
  evening_source: !input evening_source
  morning_source: !input morning_source
  # "sensor" hides the sensor's sun backup; "sun" hides the sensor (so it's empty).
  use_evening_sun_fallback: "{{ evening_source in ['both', 'sun'] }}"
  use_morning_sun_fallback: "{{ morning_source in ['both', 'sun'] }}"
  evening_threshold: !input evening_illuminance_threshold
  morning_threshold: !input morning_illuminance_threshold
  evening_sun: !input evening_sun_elevation
  morning_sun: !input morning_sun_elevation
  stale_minutes: !input sensor_stale_minutes
  sun_sanity: !input sun_sanity_check

  # The sensor inputs default to [] when left empty; turn that into ''.
  evening_sensor_input: !input evening_illuminance_sensor
  morning_sensor_input: !input morning_illuminance_sensor
  evening_sensor: "{{ evening_sensor_input if evening_sensor_input is string else '' }}"
  morning_sensor: "{{ morning_sensor_input if morning_sensor_input is string else '' }}"

  sun_elev: "{{ state_attr('sun.sun', 'elevation') }}"
  sun_known: "{{ sun_elev is number }}"

  # A sensor is only trusted if it has a number AND has reported recently.
  # last_reported moves on every update, even when the value is unchanged,
  # so a quiet-but-alive sensor isn't mistaken for a dead one.
  evening_sensor_ok: >
    {% set st = states[evening_sensor] if evening_sensor else none %}
    {{ st is not none and st.state | is_number
       and (stale_minutes | int == 0
            or (now() - st.last_reported).total_seconds() < stale_minutes | int * 60) }}
  morning_sensor_ok: >
    {% set st = states[morning_sensor] if morning_sensor else none %}
    {{ st is not none and st.state | is_number
       and (stale_minutes | int == 0
            or (now() - st.last_reported).total_seconds() < stale_minutes | int * 60) }}

  # Is it dark / bright right now? The sensor decides when it can be
  # trusted; the sun counts when its option is on, or when a configured
  # sensor is dead (so a dead sensor never leaves the curtains stuck).
  is_dark: >
    {% set by_sensor = evening_sensor_ok and states(evening_sensor) | float < evening_threshold | float %}
    {% set sun_counts = use_evening_sun_fallback or (evening_sensor != '' and not evening_sensor_ok) %}
    {% set by_sun = sun_counts and sun_known and sun_elev < evening_sun | float %}
    {% set sane = not sun_sanity or not sun_known or sun_elev < 10 %}
    {{ (by_sensor or by_sun) and sane }}
  is_bright: >
    {% set by_sensor = morning_sensor_ok and states(morning_sensor) | float > morning_threshold | float %}
    {% set sun_counts = use_morning_sun_fallback or (morning_sensor != '' and not morning_sensor_ok) %}
    {% set by_sun = sun_counts and sun_known and sun_elev > morning_sun | float %}
    {% set sane = not sun_sanity or not sun_known or sun_elev > -6 %}
    {{ (by_sensor or by_sun) and sane }}

triggers:
  - trigger: numeric_state
    id: evening_illuminance
    entity_id: !input evening_illuminance_sensor
    below: !input evening_illuminance_threshold
    for: !input evening_below_duration
    enabled: !input enable_evening_close

  - trigger: numeric_state
    id: evening_sun_elevation
    entity_id: sun.sun
    attribute: elevation
    below: !input evening_sun_elevation

  - trigger: numeric_state
    id: morning_illuminance
    entity_id: !input morning_illuminance_sensor
    above: !input morning_illuminance_threshold
    for: !input morning_above_duration
    enabled: !input enable_morning_open

  - trigger: numeric_state
    id: morning_sun_elevation
    entity_id: sun.sun
    attribute: elevation
    above: !input morning_sun_elevation

  - trigger: homeassistant
    id: startup_recheck
    event: start
    enabled: !input enable_startup_recheck

  - trigger: time_pattern
    id: periodic_recheck
    minutes: "/15"
    enabled: !input enable_periodic_recheck

  - trigger: time
    id: evening_failsafe
    at: !input evening_failsafe_time
    enabled: !input enable_evening_failsafe

  - trigger: time
    id: morning_failsafe
    at: !input morning_failsafe_time
    enabled: !input enable_morning_failsafe

conditions: []

actions:
  - choose:

      # ---- EVENING FAILSAFE: force close, ignore sensors ----
      - conditions:
          - condition: trigger
            id: evening_failsafe
          - "{{ enable_evening_close }}"
          - condition: state
            entity_id: !input curtains
            state: "open"
            match: any
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input curtains

      # ---- EVENING BRANCH: crossing OR recheck confirms it's dark ----
      # The trigger only wakes this up; is_dark re-checks the current
      # reading, the dead-sensor fallback and the sun sanity check.
      - conditions:
          - condition: trigger
            id:
              - evening_illuminance
              - evening_sun_elevation
              - startup_recheck
              - periodic_recheck
          - "{{ enable_evening_close }}"
          - condition: state
            entity_id: !input curtains
            state: "open"
            match: any
          - "{{ is_dark }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input curtains

      # ---- MORNING FAILSAFE: force open, ignore sensors ----
      - conditions:
          - condition: trigger
            id: morning_failsafe
          - "{{ enable_morning_open }}"
          - condition: state
            entity_id: !input curtains
            state: "closed"
            match: any
        sequence:
          - action: cover.open_cover
            target:
              entity_id: !input curtains

      # ---- MORNING BRANCH: crossing OR recheck confirms it's bright ----
      # Limited to the morning window. Without an end time the periodic
      # check could reopen curtains any time until midnight, including
      # right after the evening failsafe closed them.
      - conditions:
          - condition: trigger
            id:
              - morning_illuminance
              - morning_sun_elevation
              - startup_recheck
              - periodic_recheck
          - "{{ enable_morning_open }}"
          - condition: time
            after: !input morning_not_before
            before: !input morning_not_after
          - condition: state
            entity_id: !input curtains
            state: "closed"
            match: any
          - "{{ is_bright }}"
        sequence:
          - action: cover.open_cover
            target:
              entity_id: !input curtains
