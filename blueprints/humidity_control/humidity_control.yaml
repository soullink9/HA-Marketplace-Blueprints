# HA-Marketplace-Blueprints v0.2.1 - https://github.com/soullink9/HA-Marketplace-Blueprints
blueprint:
  name: Humidity Automation (Fan Control + Shower Detection)
  description: >
    Smart bathroom fan control for everyday users. Turns the fan on when
    humidity gets high or rises quickly (shower), and turns it off again
    when the room dries out. Optionally compares against an ambient
    (whole-house) humidity sensor so humid days don't turn the fan on.
    Includes simple explanations for every option, and optional
    manual-override protection with no helper entities required.
  domain: automation
  source_url: https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/blueprints/humidity_control/humidity_control.yaml
  homeassistant:
    min_version: 2024.10.0

  input:

    ############################################################################
    # SECTION 1 — SENSOR
    ############################################################################
    humidity_sensor:
      name: Humidity Sensor
      description: >
        Select the humidity sensor for this room. The automation reacts to
        every change in this sensor's value. Readings that are unavailable
        or unknown are ignored.
      selector:
        entity:
          domain: sensor

    deadband:
      name: Buffer Zone (Deadband) (%)
      description: >
        Prevents rapid on/off cycling. Example: If high threshold is 60%
        and deadband is 2%, the fan won't turn off until humidity drops
        below 58%.
      default: 2
      selector:
        number:
          min: 0
          max: 20
          step: 0.5

    ############################################################################
    # SECTION 2 — HIGH HUMIDITY (FAN)
    ############################################################################
    enable_high:
      name: Turn Fan On When Humidity Gets High
      description: >
        Enable this if you want the fan to turn on when humidity rises
        above the high threshold.
      default: false
      selector:
        boolean: {}

    high_threshold:
      name: High Humidity Level (%)
      description: >
        When humidity rises above this value, the fan will turn on after
        the required duration.
      default: 60
      selector:
        number:
          min: 0
          max: 100

    high_duration:
      name: How Long Humidity Must Stay High (minutes)
      description: >
        Prevents false triggers. Humidity must stay above the high threshold
        for this long before the fan turns on.
      default: 0
      selector:
        number:
          min: 0
          max: 120

    high_action:
      name: What To Do When Humidity Gets High
      description: >
        Actions to run when humidity stays above the high threshold long
        enough. Usually: turn on the fan.
      default: []
      selector:
        action: {}

    high_normal_duration:
      name: How Long Humidity Must Stay Normal Before Turning Off (minutes)
      description: >
        Humidity must stay below the exit threshold (or back near ambient)
        for this long before the fan turns off. Any reading back above it
        restarts the wait.
      default: 5
      selector:
        number:
          min: 0
          max: 120

    high_normal_action:
      name: What To Do When Humidity Returns to Normal
      description: >
        Actions to run when humidity drops back to normal. Usually: turn off
        the fan.
      default: []
      selector:
        action: {}

    ############################################################################
    # SECTION 2B — AMBIENT HUMIDITY BLOCKER (optional)
    ############################################################################
    ambient_sensor:
      name: "Ambient Humidity Sensor (optional)"
      description: >
        A humidity sensor somewhere else INSIDE the house (hallway,
        bedroom, or your thermostat). When set, the high-humidity fan only
        turns on if this room is noticeably more humid than the rest of the
        house — so a muggy day won't turn the fan on. Avoid outdoor
        sensors: cold outdoor air reads high % but holds little moisture.
        Select exactly one entity. Leave empty to disable the blocker. If
        this sensor goes unavailable, the blocker is skipped and normal
        threshold behavior is used.
      default: []
      selector:
        entity:
          domain: sensor
          multiple: true

    ambient_min_difference:
      name: "Ambient Blocker: Required Difference (%)"
      description: >
        How much more humid this room must be than the ambient sensor
        before the fan turns on. Example: ambient 62%, difference 10% —
        the fan won't turn on unless this room reaches 72% (and is above
        the High Humidity Level). The fan also turns off once the room
        falls back within (difference − deadband) of ambient, so it can't
        get stuck running all day when the whole house is humid. Shower
        detection is not affected by this blocker.
      default: 10
      selector:
        number:
          min: 0
          max: 50
          step: 0.5

    ############################################################################
    # SECTION 3 — LOW HUMIDITY (E.G. HUMIDIFIER)
    ############################################################################
    enable_low:
      name: Turn Something On When Humidity Gets Too Low
      description: >
        Enable this if you want to run actions when humidity drops below
        the low threshold (e.g., humidifier control).
      default: false
      selector:
        boolean: {}

    low_threshold:
      name: Low Humidity Level (%)
      description: >
        When humidity drops below this value, the low-humidity action will
        run after the required duration.
      default: 30
      selector:
        number:
          min: 0
          max: 100

    low_duration:
      name: How Long Humidity Must Stay Low (minutes)
      description: >
        Prevents false triggers. Humidity must stay below the low threshold
        for this long before actions run.
      default: 0
      selector:
        number:
          min: 0
          max: 120

    low_action:
      name: What To Do When Humidity Gets Too Low
      description: >
        Actions to run when humidity stays below the low threshold long
        enough. Usually: turn on a humidifier.
      default: []
      selector:
        action: {}

    low_normal_duration:
      name: How Long Humidity Must Stay Normal Before Turning Off (minutes)
      description: >
        Humidity must stay above the exit threshold for this long before the
        low-humidity "normal" actions run. Any reading back below it
        restarts the wait.
      default: 5
      selector:
        number:
          min: 0
          max: 120

    low_normal_action:
      name: What To Do When Humidity Returns to Normal
      description: >
        Actions to run when humidity returns to normal after being too low.
      default: []
      selector:
        action: {}

    ############################################################################
    # SECTION 4 — SHOWER DETECTION
    ############################################################################
    enable_shower:
      name: Detect Showers Automatically (Fast Humidity Rise)
      description: >
        Detects showers by looking for a rapid rise in humidity over a short
        time window. Useful when high humidity alone isn't enough. Works with
        sensors that report in small steps: the rise is measured from the
        reading where it started climbing, not just between two readings.
        Runs independently of the high-humidity side. Skipped while the
        Manual Override high-side entity (if set) is already on.
      default: false
      selector:
        boolean: {}

    shower_rise_amount:
      name: How Much Humidity Must Rise (%)
      description: >
        The minimum increase in humidity needed to count as a shower.
      default: 8
      selector:
        number:
          min: 1
          max: 30
          step: 0.5

    shower_rise_window:
      name: How Fast the Rise Must Happen (minutes)
      description: >
        The humidity must rise by the required amount within this many
        minutes to count as a shower.
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1

    shower_action:
      name: What To Do When a Shower Is Detected
      description: >
        Actions to run when a shower is detected. Usually: turn on the fan.
      default: []
      selector:
        action: {}

    ############################################################################
    # SECTION 5 — MANUAL OVERRIDE PROTECTION (no helper entities required)
    ############################################################################
    enable_manual_override_protection:
      name: Enable Manual Override Protection
      description: >
        When enabled, if you (or a physical switch/app) manually change the
        entity being controlled, the automation temporarily backs off
        instead of immediately undoing your manual change. This reads the
        entity's own built-in state history — no helper entities needed.
        Applies to both the high-humidity (fan) side and the low-humidity
        side independently, using the entities selected below. Checked at
        the moment an automatic ON/OFF is about to run.
      default: false
      selector:
        boolean: {}

    monitored_high_entity:
      name: "Manual Override: High-Side Entity (e.g. fan)"
      description: >
        The entity that high_action/high_normal_action actually control
        (usually your fan). Required if Manual Override Protection is
        enabled and you want it to apply to the high-humidity side. Select
        exactly one entity. Leave empty to skip override protection for
        this side.
      default: []
      selector:
        entity:
          multiple: true

    monitored_low_entity:
      name: "Manual Override: Low-Side Entity (e.g. humidifier)"
      description: >
        The entity that low_action/low_normal_action actually control
        (usually your humidifier). Required if Manual Override Protection
        is enabled and you want it to apply to the low-humidity side.
        Select exactly one entity. Leave empty to skip override protection
        for this side.
      default: []
      selector:
        entity:
          multiple: true

    override_direction:
      name: Override Protection Direction
      description: >
        Which manual changes should be protected, applied to both sides.
        "Both" means a manual ON blocks the next automatic OFF, and a
        manual OFF blocks the next automatic ON, each for the duration
        below.
      default: "both"
      selector:
        select:
          options:
            - label: "Both directions"
              value: "both"
            - label: "Manual ON blocks auto-OFF only"
              value: "block_off_after_manual_on"
            - label: "Manual OFF blocks auto-ON only"
              value: "block_on_after_manual_off"

    override_duration_minutes:
      name: Override Protection Duration (minutes)
      description: >
        How long a manual change should be respected before the automation
        resumes normal behavior. Measured from the moment the entity was
        manually changed.
      default: 15
      selector:
        number:
          min: 1
          max: 180
          mode: slider
          unit_of_measurement: minutes

    ############################################################################
    # SECTION 6 — DEBUGGING
    ############################################################################
    enable_debug:
      name: Debug Logging (Optional)
      description: >
        When enabled, logs shower detection, ambient-blocker and
        manual-override decisions to help with tuning.
      default: false
      selector:
        boolean: {}

mode: parallel
# Shower detection keeps a short-lived run per rising reading (see below),
# so leave room for those; anything beyond is dropped without log spam.
max: 30
max_exceeded: silent

##############################################################################
# TRIGGERS
# "Must stay high/normal for N minutes" is done by the triggers' own `for:`,
# so Home Assistant restarts the timer whenever the condition breaks.
# (Before, every reading started its own delayed run that only re-checked the
# value at the end — not "stayed", and a sensor reporting every few seconds
# hit the run limit.)
##############################################################################
trigger_variables:
  t_sensor: !input humidity_sensor
  t_ambient: !input ambient_sensor
  t_high: !input high_threshold
  t_low: !input low_threshold
  t_deadband: !input deadband
  t_diff: !input ambient_min_difference

triggers:
  - trigger: template
    id: high_on
    enabled: !input enable_high
    value_template: >
      {% set h = states(t_sensor) %}
      {% set al = t_ambient if t_ambient is list else ([t_ambient] if t_ambient else []) %}
      {% set a = states(al[0]) if al else 'unknown' %}
      {{ is_number(h) and h | float > t_high | float
         and (not is_number(a) or h | float >= a | float + t_diff | float) }}
    for:
      minutes: !input high_duration

  - trigger: template
    id: high_off
    enabled: !input enable_high
    value_template: >
      {% set h = states(t_sensor) %}
      {% set al = t_ambient if t_ambient is list else ([t_ambient] if t_ambient else []) %}
      {% set a = states(al[0]) if al else 'unknown' %}
      {{ is_number(h) and (
           h | float < t_high | float - t_deadband | float
           or (is_number(a) and h | float < a | float + t_diff | float - t_deadband | float)) }}
    for:
      minutes: !input high_normal_duration

  - trigger: template
    id: low_on
    enabled: !input enable_low
    value_template: >
      {% set h = states(t_sensor) %}
      {{ is_number(h) and h | float < t_low | float }}
    for:
      minutes: !input low_duration

  - trigger: template
    id: low_off
    enabled: !input enable_low
    value_template: >
      {% set h = states(t_sensor) %}
      {{ is_number(h) and h | float > t_low | float + t_deadband | float }}
    for:
      minutes: !input low_normal_duration

  # Every reading, for shower detection (rate of rise).
  - trigger: state
    id: reading
    entity_id: !input humidity_sensor
    enabled: !input enable_shower

  # Debug only: humidity is high, but the ambient blocker may be holding the
  # fan off. Logged so the blocker can be tuned.
  - trigger: numeric_state
    id: high_raw
    entity_id: !input humidity_sensor
    above: !input high_threshold
    for:
      minutes: !input high_duration
    enabled: !input enable_debug

  # Template triggers don't fire if their condition is already true when
  # they're set up, so catch up once after a restart.
  - trigger: homeassistant
    id: startup
    event: start

##############################################################################
# VARIABLES (rendered when a trigger fires)
##############################################################################
variables:
  humidity_sensor: !input humidity_sensor
  humidity_raw: "{{ states(humidity_sensor) }}"
  humidity: "{{ humidity_raw | float(0) }}"

  enable_high: !input enable_high
  enable_low: !input enable_low
  enable_shower: !input enable_shower

  high_threshold: !input high_threshold
  low_threshold: !input low_threshold
  deadband: !input deadband

  high_exit: "{{ high_threshold - deadband }}"
  low_exit: "{{ low_threshold + deadband }}"

  shower_rise_amount: !input shower_rise_amount
  shower_rise_window: !input shower_rise_window

  enable_debug: !input enable_debug

  # ---- Ambient humidity blocker
  ambient_sensor_list: !input ambient_sensor
  ambient_entity: >-
    {% set l = ambient_sensor_list if ambient_sensor_list is list
               else ([ambient_sensor_list] if ambient_sensor_list else []) %}
    {{ l | first if l else '' }}
  ambient_min_difference: !input ambient_min_difference
  ambient_raw: "{{ states(ambient_entity) if ambient_entity else 'unknown' }}"
  ambient_ok: "{{ is_number(ambient_raw) }}"
  ambient: "{{ ambient_raw | float(0) }}"
  # Fan ON is allowed only if the room is enough above ambient
  ambient_allows_on: >-
    {{ not ambient_ok or humidity >= ambient + ambient_min_difference }}
  # Fan OFF is allowed once the room is back near ambient
  ambient_says_normal: >-
    {{ ambient_ok and humidity < ambient + ambient_min_difference - deadband }}

  # ---- Manual override protection — no helper entities. Reads each
  # ---- monitored entity's own live context/last_changed. A change looks
  # ---- "manual" if a person did it (context.user_id set) or it has no
  # ---- automation parent context at all (typical of a physical
  # ---- switch/device).
  enable_manual_override_var: !input enable_manual_override_protection
  override_direction_var: !input override_direction
  override_duration_minutes_var: !input override_duration_minutes

  monitored_high_entity_list: !input monitored_high_entity
  monitored_high_entity_var: >-
    {{ (monitored_high_entity_list | first) if monitored_high_entity_list else none }}
  monitored_low_entity_list: !input monitored_low_entity
  monitored_low_entity_var: >-
    {{ (monitored_low_entity_list | first) if monitored_low_entity_list else none }}

  manual_high_current_state: >-
    {{ states(monitored_high_entity_var) if monitored_high_entity_var else none }}
  manual_high_is_manual_and_recent: >-
    {% set st = states[monitored_high_entity_var] if monitored_high_entity_var else none %}
    {% if st %}
      {% set is_manual = (st.context.user_id is not none) or (st.context.parent_id is none) %}
      {% set age = (now() - st.last_changed).total_seconds() %}
      {{ is_manual and age < (override_duration_minutes_var * 60) }}
    {% else %}
      {{ false }}
    {% endif %}

  manual_low_current_state: >-
    {{ states(monitored_low_entity_var) if monitored_low_entity_var else none }}
  manual_low_is_manual_and_recent: >-
    {% set st = states[monitored_low_entity_var] if monitored_low_entity_var else none %}
    {% if st %}
      {% set is_manual = (st.context.user_id is not none) or (st.context.parent_id is none) %}
      {% set age = (now() - st.last_changed).total_seconds() %}
      {{ is_manual and age < (override_duration_minutes_var * 60) }}
    {% else %}
      {{ false }}
    {% endif %}

  manual_override_blocks_high_on_var: >-
    {{ enable_manual_override_var
       and monitored_high_entity_var is not none
       and manual_high_current_state == 'off'
       and manual_high_is_manual_and_recent
       and override_direction_var in ['both','block_on_after_manual_off'] }}

  manual_override_blocks_high_off_var: >-
    {{ enable_manual_override_var
       and monitored_high_entity_var is not none
       and manual_high_current_state == 'on'
       and manual_high_is_manual_and_recent
       and override_direction_var in ['both','block_off_after_manual_on'] }}

  manual_override_blocks_low_on_var: >-
    {{ enable_manual_override_var
       and monitored_low_entity_var is not none
       and manual_low_current_state == 'off'
       and manual_low_is_manual_and_recent
       and override_direction_var in ['both','block_on_after_manual_off'] }}

  manual_override_blocks_low_off_var: >-
    {{ enable_manual_override_var
       and monitored_low_entity_var is not none
       and manual_low_current_state == 'on'
       and manual_low_is_manual_and_recent
       and override_direction_var in ['both','block_off_after_manual_on'] }}

##############################################################################
# ACTIONS
##############################################################################
actions:

  ##########################################################################
  # STARTUP — wait for the sensor, then act on where humidity is now
  ##########################################################################
  - if: "{{ trigger.id == 'startup' }}"
    then:
      - wait_template: "{{ is_number(states(humidity_sensor)) }}"
        timeout: "00:05:00"
        continue_on_timeout: false
      # Re-read now that the sensor is back; the trigger-time values were
      # taken while it was still unavailable.
      - variables:
          h: "{{ states(humidity_sensor) | float(0) }}"
          a_raw: "{{ states(ambient_entity) if ambient_entity else 'unknown' }}"
          a_ok: "{{ is_number(a_raw) }}"
          a: "{{ a_raw | float(0) }}"
      - if: "{{ enable_high }}"
        then:
          - choose:
              - conditions:
                  - "{{ h > high_threshold and (not a_ok or h >= a + ambient_min_difference) }}"
                  - "{{ not manual_override_blocks_high_on_var }}"
                sequence: !input high_action
              - conditions:
                  - "{{ h < high_exit or (a_ok and h < a + ambient_min_difference - deadband) }}"
                  - "{{ not manual_override_blocks_high_off_var }}"
                sequence: !input high_normal_action
      - if: "{{ enable_low }}"
        then:
          - choose:
              - conditions:
                  - "{{ h < low_threshold }}"
                  - "{{ not manual_override_blocks_low_on_var }}"
                sequence: !input low_action
              - conditions:
                  - "{{ h > low_exit }}"
                  - "{{ not manual_override_blocks_low_off_var }}"
                sequence: !input low_normal_action
      - stop: Startup catch-up done

  - choose:
      ######################################################################
      # HIGH HUMIDITY — stayed high (and above ambient) for high_duration
      ######################################################################
      - conditions:
          - condition: trigger
            id: high_on
          - "{{ not manual_override_blocks_high_on_var }}"
        sequence: !input high_action

      ######################################################################
      # HIGH NORMAL RETURN — stayed below the exit threshold, or back near
      # ambient, for high_normal_duration (so it can't run all day on
      # humid days)
      ######################################################################
      - conditions:
          - condition: trigger
            id: high_off
          - "{{ not manual_override_blocks_high_off_var }}"
        sequence: !input high_normal_action

      ######################################################################
      # LOW HUMIDITY (e.g. humidifier)
      ######################################################################
      - conditions:
          - condition: trigger
            id: low_on
          - "{{ not manual_override_blocks_low_on_var }}"
        sequence: !input low_action

      - conditions:
          - condition: trigger
            id: low_off
          - "{{ not manual_override_blocks_low_off_var }}"
        sequence: !input low_normal_action

      ######################################################################
      # DEBUG — humidity is high but the ambient blocker is holding the fan
      ######################################################################
      - conditions:
          - condition: trigger
            id: high_raw
          - "{{ enable_high and not ambient_allows_on }}"
        sequence:
          - action: logbook.log
            data:
              name: Humidity Automation
              message: >
                Ambient blocker: room {{ humidity }}% is above
                {{ high_threshold }}% but within {{ ambient_min_difference }}%
                of ambient ({{ ambient }}%) — fan not turned on.

      ######################################################################
      # SHOWER DETECTION (rate of rise)
      # Comparing only two consecutive readings missed showers on sensors
      # that report every 1–2 %. Instead, each rising reading remembers
      # where the climb started and waits up to the window for humidity to
      # reach start + rise. Runs that time out just end.
      ######################################################################
      - conditions:
          - condition: trigger
            id: reading
          - "{{ enable_shower and not manual_override_blocks_high_on_var }}"
          - >
            {% set f = trigger.from_state %}
            {{ f is not none and is_number(f.state) and is_number(trigger.to_state.state)
               and trigger.to_state.state | float > f.state | float }}
        sequence:
          - variables:
              shower_start: "{{ trigger.from_state.state | float }}"
          - wait_template: >
              {{ states(humidity_sensor) | float(0) >= shower_start + shower_rise_amount }}
            timeout:
              minutes: "{{ shower_rise_window }}"
            continue_on_timeout: false
          # Several overlapping waits can finish on the same reading; skip
          # if the fan (Manual Override high-side entity) is already on.
          - condition: template
            value_template: >
              {{ monitored_high_entity_var is none
                 or not is_state(monitored_high_entity_var, 'on') }}
          - if:
              - condition: template
                value_template: "{{ enable_debug }}"
            then:
              - action: logbook.log
                data:
                  name: Humidity Automation
                  message: >
                    Shower detected: humidity rose from {{ shower_start }}% to
                    {{ states(humidity_sensor) }}% within
                    {{ shower_rise_window }} minutes.
          - sequence: !input shower_action

    default: []
