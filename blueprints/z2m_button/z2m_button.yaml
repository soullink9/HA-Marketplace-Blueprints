# HA-Marketplace-Blueprints v0.6.0 - https://github.com/soullink9/HA-Marketplace-Blueprints
blueprint:
  name: Zigbee2MQTT Button – Single, Double, Hold and Release · v0.6.0
  description: >
    **Version 0.6.0** · [What's new](https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/CHANGELOG.md)


    Runs your actions when a Zigbee2MQTT button is pressed once, pressed
    twice, held or released. Leave any of them empty to ignore it.
  domain: automation
  author: soullink9
  source_url: https://github.com/soullink9/HA-Marketplace-Blueprints/blob/main/blueprints/z2m_button/z2m_button.yaml
  homeassistant:
    min_version: "2026.11.0"

  input:
    section_button:
      name: Button
      icon: mdi:gesture-tap-button
      input:
        button_device:
          name: Button
          description: >-
            Press each type once after pairing so Zigbee2MQTT learns it.
          selector:
            device:
              filter:
              - integration: mqtt

        single_press_action:
          name: Single press
          default: []
          selector:
            action: {}

        double_press_action:
          name: Double press
          default: []
          selector:
            action: {}

        hold_action:
          name: Hold
          default: []
          selector:
            action: {}

        release_action:
          name: Release after hold
          description: >-
            For "hold to dim, release to stop". Not every button sends this.
          default: []
          selector:
            action: {}

    section_advanced:
      name: Advanced
      icon: mdi:cog
      collapsed: true
      input:
        automation_mode:
          name: When pressed again while running
          default: restart
          selector:
            select:
              options:
              - label: Start over (recommended)
                value: restart
              - label: Ignore the new press
                value: single
              - label: Run after the current one
                value: queued
              - label: Run both at once
                value: parallel

triggers:
  - id: single_press
    trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: single

  - id: double_press
    trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: double

  - id: hold
    trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: hold

  - id: release
    trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: release

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: single_press
        sequence: !input single_press_action

      - conditions:
          - condition: trigger
            id: double_press
        sequence: !input double_press_action

      - conditions:
          - condition: trigger
            id: hold
        sequence: !input hold_action

      - conditions:
          - condition: trigger
            id: release
        sequence: !input release_action

mode: !input automation_mode
